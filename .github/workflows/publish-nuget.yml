name: Publish NuGet Package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "7.0.x"

      - name: Restore
        run: dotnet restore ./braspin-pagarme-dotnet-sdk.csproj

      - name: Build
        run: dotnet build ./braspin-pagarme-dotnet-sdk.csproj --configuration Release --no-restore

      - name: Pack
        run: dotnet pack ./braspin-pagarme-dotnet-sdk.csproj --configuration Release --no-build --output ./artifacts

      - name: Publish to nuget.org
        run: dotnet nuget push "./artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
